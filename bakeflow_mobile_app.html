<!DOCTYPE html>
<html lang="en" class="h-full bg-[#121212]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bakeflow — A little more art in every bake</title>
  
  <!-- Google Fonts: Syne (Display/Logo), Instrument Serif (Editorial Accent), Inter (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            butter: '#F5EFC6',
            oxblood: '#4D0E12',
            cerulean: '#A5BCD6',
            potting: '#4A2E27',
            java: '#231815',
            cream: '#FAF8F2',
            mutedGray: '#8C8984',
            lightBorder: '#E9E5DD',
            successGreen: '#416B50',
            errorRed: '#B84035',
          },
          fontFamily: {
            brand: ['Syne', 'sans-serif'],
            serif: ['Instrument Serif', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(35, 24, 21, 0.06)',
            'elevated': '0 10px 30px -5px rgba(35, 24, 21, 0.12)',
            'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.04)',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar & Utility Classes */
    ::-webkit-scrollbar { width: 0px; height: 0px; }
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    .logo-font { font-family: 'Syne', sans-serif; letter-spacing: -0.04em; }
    .serif-font { font-family: 'Instrument Serif', serif; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Mobile Frame styling for Desktop View */
    @media (min-width: 640px) {
      .app-frame {
        width: 390px;
        height: 844px;
        border-radius: 48px;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 0 0 0 12px #222;
      }
    }

    /* Pulse animation for timer active state */
    @keyframes timerPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }
    .animate-timer { animation: timerPulse 2s infinite ease-in-out; }
  </style>
</head>
<body class="h-full w-full bg-[#181615] flex items-center justify-center sm:py-6 sm:px-4 antialiased select-none">

  <!-- Outer Desktop Frame Container -->
  <div id="app-container" class="relative w-full h-full sm:h-auto flex flex-col items-center justify-center">
    
    <!-- Top Desktop View Control Bar -->
    <div class="hidden sm:flex items-center justify-between w-[390px] mb-3 px-2 text-xs text-stone-400 font-medium">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Bakeflow v2.4 Mobile Preview</span>
      </div>
      <button id="toggle-frame-btn" class="hover:text-white transition-colors flex items-center gap-1 bg-stone-800 px-2.5 py-1 rounded-full text-[11px]">
        <i data-lucide="smartphone" class="w-3 h-3"></i> Dynamic Frame
      </button>
    </div>

    <!-- Phone Canvas Shell -->
    <div id="phone-shell" class="app-frame relative w-full h-full sm:w-[390px] sm:h-[844px] bg-cream dark:bg-java text-java dark:text-cream flex flex-col overflow-hidden transition-all duration-300">
      
      <!-- Simulated Mobile Status Bar -->
      <div class="w-full pt-3 pb-1 px-7 flex items-center justify-between text-[13px] font-semibold tracking-tight z-50 select-none bg-transparent">
        <span id="current-time">9:41</span>
        <div class="w-24 h-4 bg-black dark:bg-stone-900 rounded-full absolute left-1/2 -translate-x-1/2 top-2 hidden sm:block"></div>
        <div class="flex items-center space-x-1.5 text-current">
          <i data-lucide="signal" class="w-3.5 h-3.5 stroke-[2.5]"></i>
          <i data-lucide="wifi" class="w-3.5 h-3.5 stroke-[2.5]"></i>
          <div class="w-5 h-2.5 border-1.5 border-current rounded-sm p-0.5 flex items-center">
            <div class="w-full h-full bg-current rounded-xs"></div>
          </div>
        </div>
      </div>

      <!-- MAIN DYNAMIC CONTENT VIEWPORT -->
      <main id="main-viewport" class="flex-1 w-full relative overflow-y-auto overflow-x-hidden no-scrollbar pb-20">
        <!-- Screens will be injected dynamically here -->
      </main>

      <!-- Persistent Bottom Navigation Bar -->
      <nav id="bottom-nav" class="absolute bottom-0 inset-x-0 bg-cream/90 dark:bg-java/90 backdrop-blur-md border-t border-lightBorder/80 dark:border-stone-800 px-4 py-2 flex justify-around items-center z-40 transition-transform duration-300">
        <button onclick="navigateTo('home')" class="nav-item flex flex-col items-center gap-1 py-1 px-3 text-oxblood dark:text-butter transition-colors" data-target="home">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium tracking-tight">Home</span>
        </button>
        <button onclick="navigateTo('discover')" class="nav-item flex flex-col items-center gap-1 py-1 px-3 text-mutedGray hover:text-java dark:hover:text-cream transition-colors" data-target="discover">
          <i data-lucide="compass" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium tracking-tight">Discover</span>
        </button>
        <!-- Center Action Button: Guided Bake -->
        <button onclick="openGuidedBakeSelection()" class="flex flex-col items-center justify-center -mt-5 bg-oxblood text-butter w-12 h-12 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-all">
          <i data-lucide="chef-hat" class="w-6 h-6 stroke-[2]"></i>
        </button>
        <button onclick="navigateTo('saved')" class="nav-item flex flex-col items-center gap-1 py-1 px-3 text-mutedGray hover:text-java dark:hover:text-cream transition-colors" data-target="saved">
          <div class="relative">
            <i data-lucide="bookmark" class="w-5 h-5"></i>
            <span id="saved-badge" class="hidden absolute -top-1 -right-1.5 w-2.5 h-2.5 bg-oxblood rounded-full"></span>
          </div>
          <span class="text-[10px] font-medium tracking-tight">Saved</span>
        </button>
        <button onclick="navigateTo('profile')" class="nav-item flex flex-col items-center gap-1 py-1 px-3 text-mutedGray hover:text-java dark:hover:text-cream transition-colors" data-target="profile">
          <i data-lucide="user" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium tracking-tight">Profile</span>
        </button>
      </nav>

      <!-- Global Toast Container -->
      <div id="toast" class="absolute top-12 left-1/2 -translate-x-1/2 bg-java dark:bg-butter text-cream dark:text-java text-xs px-4 py-2.5 rounded-full shadow-elevated z-50 flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-10px]">
        <i data-lucide="check-circle" class="w-4 h-4 text-butter dark:text-oxblood"></i>
        <span id="toast-message" class="font-medium">Action completed</span>
      </div>

      <!-- AI Assistant Modal ("Ask Bakeflow") -->
      <div id="ai-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="w-full sm:max-w-md bg-cream dark:bg-java rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transition-transform duration-300 translate-y-full sm:translate-y-0 border border-lightBorder/50 dark:border-stone-800">
          <div class="flex items-center justify-between mb-4 border-b border-lightBorder dark:border-stone-800 pb-3">
            <div class="flex items-center gap-2">
              <div class="p-2 rounded-xl bg-oxblood/10 text-oxblood dark:bg-butter/10 dark:text-butter">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
              </div>
              <div>
                <h3 class="font-bold text-base text-java dark:text-cream">Ask Bakeflow</h3>
                <p class="text-[11px] text-mutedGray">Instant pastry troubleshooting & science</p>
              </div>
            </div>
            <button onclick="toggleAIModal(false)" class="p-1 rounded-full text-stone-400 hover:text-java dark:hover:text-white">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
          
          <div id="ai-chat-history" class="h-60 overflow-y-auto space-y-3 pr-1 text-xs mb-4 no-scrollbar">
            <div class="bg-butter/50 dark:bg-stone-800/80 p-3 rounded-2xl rounded-tl-none border border-butter">
              <p class="font-semibold text-oxblood dark:text-butter mb-1">Bakeflow Assistant</p>
              <p class="text-java/80 dark:text-stone-300 leading-relaxed">Hello Baker! Got a question about dough hydration, meringue peaks, or why a cake collapsed? Ask me anything below!</p>
            </div>
          </div>

          <!-- Quick Prompts -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar mb-3 py-1">
            <button onclick="askAIPrompt('Why did my Basque cheesecake crack?')" class="whitespace-nowrap px-3 py-1.5 bg-white dark:bg-stone-800 border border-lightBorder dark:border-stone-700 text-[11px] rounded-full text-java dark:text-stone-300 hover:border-oxblood transition-colors">
              🍰 Why did my cheesecake crack?
            </button>
            <button onclick="askAIPrompt('Substitutes for buttermilk?')" class="whitespace-nowrap px-3 py-1.5 bg-white dark:bg-stone-800 border border-lightBorder dark:border-stone-700 text-[11px] rounded-full text-java dark:text-stone-300 hover:border-oxblood transition-colors">
              🥛 Buttermilk substitute
            </button>
            <button onclick="askAIPrompt('How to check bread proofing?')" class="whitespace-nowrap px-3 py-1.5 bg-white dark:bg-stone-800 border border-lightBorder dark:border-stone-700 text-[11px] rounded-full text-java dark:text-stone-300 hover:border-oxblood transition-colors">
              🍞 Bread proof test
            </button>
          </div>

          <form onsubmit="handleAISubmit(event)" class="relative flex items-center">
            <input type="text" id="ai-input" placeholder="Ask a baking question..." class="w-full bg-white dark:bg-stone-800 border border-lightBorder dark:border-stone-700 rounded-full pl-4 pr-10 py-2.5 text-xs focus:outline-none focus:border-oxblood text-java dark:text-cream">
            <button type="submit" class="absolute right-1.5 p-1.5 bg-oxblood text-butter rounded-full hover:scale-105 active:scale-95 transition-all">
              <i data-lucide="send" class="w-3.5 h-3.5"></i>
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ==========================================================================
       1. DATA STRUCTURES & APPLICATION STATE

    const RECIPES_DATA = [

        ],
        equipment: ['9-inch tart ring', 'Whisk', 'Pastry weights'],

          { title: 'Make Sablé Shell', text: 'Mix flour, cocoa, butter, and sugar. Roll out, fit into tart ring, blind bake with weights for 15 mins at 175°C.', durationSec: 900 },
          { title: 'Prepare Silky Ganache', text: 'Heat cream to a simmer, pour over chopped chocolate. Let sit for 1 min, then stir gently from center out.', durationSec: 180 },

      {

        ingredients: [
          { name: 'Unsalted butter', amount: 100, unit: 'g' },

          { title: 'Chill & Pipe', text: 'Fold in browned butter. Chill batter in fridge for 1 hour. Pipe into buttered madeleine mold.', durationSec: 3600 },

    // State Variables
    let appState = {
      currentTab: 'splash',
      activeRecipe: RECIPES_DATA[0],
      savedIds: JSON.parse(localStorage.getItem('bakeflow_saved') || '["burnt-basque-cheesecake"]'),
      journalEntries: JSON.parse(localStorage.getItem('bakeflow_journal') || '[]'),
      unitSystem: localStorage.getItem('bakeflow_units') || 'metric', // 'metric' or 'imperial'
      darkMode: localStorage.getItem('bakeflow_dark') === 'true',
      user: JSON.parse(localStorage.getItem('bakeflow_user') || '{"name":"Alex Baker","email":"alex.baker@bakeflow.app","level":"Pastry Enthusiast"}'),
      guided: {
        recipe: null,
        currentStep: 0,
        completedSteps: [],
        timerInterval: null,
        timerSeconds: 0,
        timerIsRunning: false
      }
    };

    /* ==========================================================================
       2. APP NAVIGATION & LIFECYCLE
       ========================================================================== */
    window.onload = function() {
      // Sync Dark Mode Class
      if (appState.darkMode) document.documentElement.classList.add('dark');
      
      // Update Live Clock
      updateClock();
      setInterval(updateClock, 30000);

      // Render Initial Screen (Splash)
      renderScreen('splash');

      // Initialize Lucide Icons
      lucide.createIcons();
    };

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      const clockEl = document.getElementById('current-time');
      if (clockEl) clockEl.textContent = timeStr;
    }

    function navigateTo(screenId, params = {}) {
      appState.currentTab = screenId;
      
      // Update Bottom Navigation Highlights
      const navBar = document.getElementById('bottom-nav');
      if (['splash', 'onboarding', 'login', 'guided'].includes(screenId)) {
        navBar.classList.add('translate-y-full');
      } else {
        navBar.classList.remove('translate-y-full');
      }

      // Update Active Nav Icon
      document.querySelectorAll('.nav-item').forEach(btn => {
        if (btn.dataset.target === screenId) {
          btn.classList.add('text-oxblood', 'dark:text-butter');
          btn.classList.remove('text-mutedGray');
        } else {
          btn.classList.remove('text-oxblood', 'dark:text-butter');
          btn.classList.add('text-mutedGray');
        }
      });

      renderScreen(screenId, params);
      updateSavedBadge();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
      }, 2500);
    }

    /* ==========================================================================
       3. SCREEN RENDERERS
       ========================================================================== */
    function renderScreen(screenId, params = {}) {
      const viewport = document.getElementById('main-viewport');
      viewport.scrollTop = 0;

      switch (screenId) {
        case 'splash':
          viewport.innerHTML = renderSplashScreen();
          break;
        case 'onboarding':
          viewport.innerHTML = renderOnboardingScreen();
          break;
        case 'login':
          viewport.innerHTML = renderLoginScreen();
          break;
        case 'home':
          viewport.innerHTML = renderHomeScreen();
          break;
        case 'discover':
          viewport.innerHTML = renderDiscoverScreen(params.filter || 'All');
          break;
        case 'recipe-detail':
          viewport.innerHTML = renderRecipeDetailScreen(params.recipe || appState.activeRecipe);
          break;
        case 'guided':
          viewport.innerHTML = renderGuidedBakeScreen();
          break;
        case 'saved':
          viewport.innerHTML = renderSavedScreen();
          break;
        case 'profile':
          viewport.innerHTML = renderProfileScreen();
          break;
        case 'journal':
          viewport.innerHTML = renderJournalScreen();
          break;
        case 'settings':
          viewport.innerHTML = renderSettingsScreen();
          break;
        default:
          viewport.innerHTML = renderHomeScreen();
      }

      lucide.createIcons();
    }

    // --------------------------------------------------------------------------
    // SCREEN 1: SPLASH SCREEN (Matches Exact Image #1)
    // --------------------------------------------------------------------------
    function renderSplashScreen() {
      return `
        <div class="h-full w-full bg-butter flex flex-col justify-between p-7 text-java relative overflow-hidden">
          <div class="pt-8 text-center space-y-2">
            <h1 class="logo-font text-5xl font-extrabold tracking-tight text-java">bakeflow</h1>
            <p class="serif-font text-xl italic text-potting">A little more art in every bake.</p>
          </div>

          <!-- Hero Baked Cheesecake Image with soft torn paper look -->
          <div class="relative w-full h-80 my-auto rounded-3xl overflow-hidden shadow-2xl border-4 border-white/60">
            <img src="${RECIPES_DATA[0].image}" class="w-full h-full object-cover" alt="Burnt Basque Cheesecake">
            <div class="absolute inset-0 bg-gradient-to-t from-java/60 via-transparent to-transparent flex items-end p-5">
              <span class="text-xs uppercase tracking-widest text-butter font-semibold">Featured Bake of the Day</span>
            </div>
          </div>

          <div class="space-y-4 text-center pb-4">
            <p class="text-[11px] uppercase tracking-widest text-potting/80 font-bold">RECIPES / GUIDES / AI ASSISTANT</p>

      const isLast = g.currentStep === g.recipe.steps.length - 1;
      const isCompleted = g.completedSteps.includes(g.currentStep);

    /* ==========================================================================

    function togglePassVisibility() {
      const passInput = document.getElementById('login-pass');
      if (passInput) {
        passInput.type = passInput.type === 'password' ? 'text' : 'password';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      appState.user.email = email;
      localStorage.setItem('bakeflow_user', JSON.stringify(appState.user));
      showToast('Signed in successfully!');
      navigateTo('home');
    }

    function handleLoginGoogle() {
      showToast('Signed in with Google Prototype');
      navigateTo('home');
    }

    function openRecipeDetail(recipeId) {
      const recipe = RECIPES_DATA.find(r => r.id === recipeId);
      if (recipe) {
        navigateTo('recipe-detail', { recipe });
      }
    }

    function toggleSaveRecipe(recipeId, event) {
      if (event) event.stopPropagation();
      const idx = appState.savedIds.indexOf(recipeId);
      if (idx > -1) {
        appState.savedIds.splice(idx, 1);
        showToast('Removed from saved');
      } else {
        appState.savedIds.push(recipeId);
        showToast('Saved to collection');
      }
      localStorage.setItem('bakeflow_saved', JSON.stringify(appState.savedIds));
      updateSavedBadge();
      
      // Re-render active view if on saved tab or recipe detail
      if (appState.currentTab === 'saved') renderScreen('saved');
      if (appState.currentTab === 'recipe-detail') renderScreen('recipe-detail', { recipe: appState.activeRecipe });
    }

    function updateSavedBadge() {
      const badge = document.getElementById('saved-badge');
      if (badge) {
        if (appState.savedIds.length > 0) badge.classList.remove('hidden');
        else badge.classList.add('hidden');
      }
    }

    function adjustServings(newServings) {
      if (newServings < 2) return;
      const recipe = appState.activeRecipe;
      const factor = newServings / recipe.servings;
      
      const servingEl = document.getElementById('serving-count');
      if (servingEl) servingEl.textContent = newServings;

      document.querySelectorAll('.ingredient-qty').forEach(el => {
        const base = parseFloat(el.dataset.base);
        const unit = el.dataset.unit;
        let scaled = Math.round(base * factor * 10) / 10;

        if (appState.unitSystem === 'imperial' && unit === 'g') {
          scaled = Math.round((scaled / 28.35) * 10) / 10 + ' oz';
        } else {
          scaled = `${scaled} ${unit}`;
        }

        el.textContent = scaled;
      });
    }

    // --------------------------------------------------------------------------
    // GUIDED BAKING TIMER LOGIC
    // --------------------------------------------------------------------------
    function startGuidedBake(recipeId) {
      const recipe = RECIPES_DATA.find(r => r.id === recipeId);
      if (!recipe) return;

      appState.guided.recipe = recipe;
      appState.guided.currentStep = 0;
      appState.guided.completedSteps = [];
      appState.guided.timerSeconds = recipe.steps[0].durationSec || 0;
      appState.guided.timerIsRunning = false;

      navigateTo('guided');
    }

    function openGuidedBakeSelection() {
      startGuidedBake('burnt-basque-cheesecake');
    }

    function exitGuidedBake() {
      if (appState.guided.timerInterval) clearInterval(appState.guided.timerInterval);
      navigateTo('home');
    }

    function toggleTimer() {
      const g = appState.guided;
      if (g.timerIsRunning) {
        clearInterval(g.timerInterval);
        g.timerIsRunning = false;
      } else {
        if (g.timerSeconds <= 0) return;
        g.timerIsRunning = true;
        g.timerInterval = setInterval(() => {
          g.timerSeconds--;
          const timerEl = document.getElementById('timer-display');
          if (timerEl) timerEl.textContent = formatTime(g.timerSeconds);

          if (g.timerSeconds <= 0) {
            clearInterval(g.timerInterval);
            g.timerIsRunning = false;
            showToast('⏰ Step timer completed!');
            renderScreen('guided');
          }
        }, 1000);
      }
      renderScreen('guided');
    }

    function resetTimer(seconds) {
      if (appState.guided.timerInterval) clearInterval(appState.guided.timerInterval);
      appState.guided.timerSeconds = seconds;
      appState.guided.timerIsRunning = false;
      renderScreen('guided');
    }

    function nextStep() {
      const g = appState.guided;
      if (g.timerInterval) clearInterval(g.timerInterval);
      
      if (!g.completedSteps.includes(g.currentStep)) {
        g.completedSteps.push(g.currentStep);
      }

      if (g.currentStep < g.recipe.steps.length - 1) {
        g.currentStep++;
        g.timerSeconds = g.recipe.steps[g.currentStep].durationSec || 0;
        g.timerIsRunning = false;
        renderScreen('guided');
      } else {
        // Complete Bake
        const newEntry = {
          recipeTitle: g.recipe.title,
          date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
          rating: 5,
          notes: 'Completed guided baking session. Turned out golden with a perfectly soft center!'
        };
        appState.journalEntries.unshift(newEntry);
        localStorage.setItem('bakeflow_journal', JSON.stringify(appState.journalEntries));
        
        showToast('🎉 Bake Completed & Logged to Journal!');
        navigateTo('journal');
      }
    }

    function prevStep() {
      const g = appState.guided;
      if (g.currentStep > 0) {
        if (g.timerInterval) clearInterval(g.timerInterval);
        g.currentStep--;
        g.timerSeconds = g.recipe.steps[g.currentStep].durationSec || 0;
        g.timerIsRunning = false;
        renderScreen('guided');
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // --------------------------------------------------------------------------
    // AI ASSISTANT ("Ask Bakeflow") LOGIC
    // --------------------------------------------------------------------------
    function toggleAIModal(show) {
      const modal = document.getElementById('ai-modal');
      if (show) {
        modal.classList.remove('opacity-0', 'pointer-events-none');
        modal.firstElementChild.classList.remove('translate-y-full');
      } else {
        modal.classList.add('opacity-0', 'pointer-events-none');
        modal.firstElementChild.classList.add('translate-y-full');
      }
    }

    function askAIPrompt(question) {
      const history = document.getElementById('ai-chat-history');
      
      // Add User Message
      history.innerHTML += `
        <div class="bg-oxblood text-butter p-3 rounded-2xl rounded-tr-none ml-auto max-w-[80%] text-right">
          <p class="text-xs">${question}</p>
        </div>
      `;

      // Simulate Assistant Reply
      setTimeout(() => {
        let answer = "Great baking question! Keeping your ingredients at uniform room temperature usually resolves this.";
        
        if (question.includes('cheesecake crack')) {
          answer = "Basque cheesecake is SUPPOSED to crack slightly on top due to high caramelization! If you mean classic cheesecake: avoid over-whipping air into eggs and cool slowly in an oven with the door propped open.";
        } else if (question.includes('buttermilk')) {
          answer = "Combine 1 cup (240ml) of milk with 1 tablespoon of lemon juice or white vinegar. Let sit for 5 minutes until slightly curdled!";
        } else if (question.includes('proof')) {
          answer = "Use the 'poke test': gently press your finger 1/2 inch into the dough. If it springs back slowly and leaves a tiny indent, it's ready to bake!";
        } else if (question.includes('lamination')) {
          answer = "Ensure butter block and dough détrempe share the EXACT same pliability (around 14-16°C). If butter is too cold, it breaks inside dough; if too warm, it melts into flour.";
        }

        history.innerHTML += `
          <div class="bg-butter/60 dark:bg-stone-800 p-3 rounded-2xl rounded-tl-none border border-butter">
            <p class="font-semibold text-oxblood dark:text-butter mb-1">Bakeflow Assistant</p>
            <p class="text-java/80 dark:text-stone-300 leading-relaxed">${answer}</p>
          </div>
        `;
        history.scrollTop = history.scrollHeight;
      }, 500);
    }

    function handleAISubmit(e) {
      e.preventDefault();
      const input = document.getElementById('ai-input');
      if (input.value.trim()) {
        askAIPrompt(input.value);
        input.value = '';
      }
    }
  </script>
</body>
</html>
